name: ALT-UST 2.5 denetim

on:
  push:
    branches: [main]
    paths:
      - "denetim_v2.py"
      - "denetim_v5.py"
      - "DATA.duckdb"
      - "tests/**"
      - ".github/workflows/alt-ust-denetim.yml"
  pull_request:
    branches: [main]
    paths:
      - "denetim_v2.py"
      - "denetim_v5.py"
      - "DATA.duckdb"
      - "tests/**"
      - ".github/workflows/alt-ust-denetim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Depoyu ve Git LFS verilerini indir
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: python -m pip install --upgrade pip duckdb numpy pandas scipy tabulate

      - name: Python sözdizimini doğrula
        run: python -m py_compile denetim_v2.py denetim_v5.py tests/test_denetim_v2.py tests/test_denetim_v5_periods.py

      - name: Birim testlerini çalıştır
        run: python -m unittest discover -s tests -v

      - name: Ham veride tarih ve oran kapsamını teşhis et
        run: |
          python - <<'PY'
          import duckdb
          import pandas as pd
          from pathlib import Path

          db = Path("DATA.duckdb")
          if not db.is_file():
              raise SystemExit("HATA: DATA.duckdb bulunamadı.")
          con = duckdb.connect(str(db), read_only=True)
          try:
              print("Tablolar:", con.execute("SHOW TABLES").fetchall())
              df = con.execute('''
                  SELECT match_date, FT, "MS25AÜ", "25A_num", "25Ü_num"
                  FROM matches_analysis
              ''').fetchdf()
          finally:
              con.close()

          print("Ham satır sayısı:", len(df))
          dates = pd.to_datetime(df["match_date"], errors="coerce")
          print("Tarih min:", dates.min())
          print("Tarih max:", dates.max())
          print("Tarihi çözülemeyen:", int(dates.isna().sum()))
          years = dates.dt.year
          for year in range(2013, 2023):
              part = df.loc[years.eq(year)].copy()
              if part.empty:
                  print(f"YIL {year}: satır=0")
                  continue
              ft = part["FT"].astype("string").str.contains(r"(?<!\d)\d{1,2}\s*[-:–—]\s*\d{1,2}(?!\d)", regex=True, na=False)
              alt = pd.to_numeric(part["25A_num"].astype("string").str.replace(",", ".", regex=False), errors="coerce")
              ust = pd.to_numeric(part["25Ü_num"].astype("string").str.replace(",", ".", regex=False), errors="coerce")
              print(
                  f"YIL {year}: satır={len(part)}, FT biçimi={int(ft.sum())}, "
                  f"ALT oran>1={int((alt > 1).sum())}, ÜST oran>1={int((ust > 1).sum())}, "
                  f"MS25AÜ dolu={int(part['MS25AÜ'].notna().sum())}"
              )
          PY

      - name: Gerçek DATA.duckdb üzerinde tam denetim
        run: python denetim_v5.py "$GITHUB_WORKSPACE/DATA.duckdb"

      - name: İki dönemli analiz çıktılarını doğrula
        if: always()
        run: |
          python - <<'PY'
          import csv
          import pathlib
          import sys

          out = pathlib.Path("denetim_ciktilari")
          quality = out / "08_kalite_kontrol.csv"
          bands = out / "05_iki_donem_tum_bantlar.csv"
          forbidden = [
              out / "04c_bantlar_nihai_test.csv",
              out / "05_uc_donem_tum_bantlar.csv",
          ]
          missing = [str(p) for p in (quality, bands) if not p.is_file()]
          if missing:
              print("HATA: beklenen çıktı eksik:", ", ".join(missing))
              sys.exit(1)
          if any(p.exists() for p in forbidden):
              print("HATA: eski nihai test/üç dönem çıktısı üretildi.")
              sys.exit(1)

          with quality.open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          checks = {row.get("kontrol"): row.get("sonuc") for row in rows}
          for key in (
              "veritabani_satir", "2021_mac_sayisi", "2021_alt_oran_dolu",
              "2021_ust_oran_dolu", "2021_donem_disi_mac", "kesif_bahis", "dogrulama_bahis",
              "long_donem_disi_bahis", "donem_disi_ham_bahis",
          ):
              print(f"{key}: {checks.get(key)}")
          try:
              if int(float(checks.get("2021_mac_sayisi", "0"))) <= 0:
                  raise ValueError("2021 ham satır sayısı sıfır")
              if int(float(checks.get("2021_alt_oran_dolu", "-1"))) != 0:
                  raise ValueError("2021 ALT oran sütunu tamamen boş değil")
              if int(float(checks.get("2021_donem_disi_mac", "-1"))) != int(float(checks.get("2021_mac_sayisi", "0"))):
                  raise ValueError("2021 kayıtlarının tümü Donem_Disi işaretli değil")
              if int(float(checks.get("2021_ust_oran_dolu", "-1"))) != 0:
                  raise ValueError("2021 ÜST oran sütunu tamamen boş değil")
              if int(float(checks.get("kesif_bahis", "0"))) <= 0:
                  raise ValueError("Keşif döneminde bahis yok")
              if int(float(checks.get("dogrulama_bahis", "0"))) <= 0:
                  raise ValueError("Doğrulama döneminde bahis yok")
              if int(float(checks.get("long_donem_disi_bahis", "-1"))) != 0:
                  raise ValueError("Analiz long tablosunda dönem dışı satır var")
          except (TypeError, ValueError) as exc:
              print("HATA:", exc)
              sys.exit(1)

          with bands.open("r", encoding="utf-8-sig", newline="") as f:
              band_rows = list(csv.DictReader(f))
          print("05_iki_donem_tum_bantlar.csv satır:", len(band_rows))
          print("Dönem etiketleri:", sorted({r.get("donem", "") for r in band_rows}))
          if any(r.get("donem") not in {"Kesif", "Dogrulama"} for r in band_rows):
              print("HATA: iki dönemli bant dosyasında beklenmeyen dönem etiketi var.")
              sys.exit(1)
          PY

      - name: Denetim çıktılarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alt-ust-denetim-raporu
          path: denetim_ciktilari/
          if-no-files-found: warn
          retention-days: 30
