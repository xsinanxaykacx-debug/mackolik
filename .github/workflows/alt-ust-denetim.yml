name: ALT-UST 2.5 denetim

on:
  push:
    branches: [main]
    paths:
      - 'denetim_v5.py'
      - 'tests/test_denetim_v5.py'
      - 'denetim_ciktilari/**'
      - '.github/workflows/alt-ust-denetim.yml'
  pull_request:
    branches: [main]
    paths:
      - 'denetim_v5.py'
      - 'tests/test_denetim_v5.py'
      - 'denetim_ciktilari/**'
      - '.github/workflows/alt-ust-denetim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Depoyu ve Git LFS verilerini indir
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: DATA.duckdb dosyasını ve tablosunu doğrula
        run: |
          test -s DATA.duckdb
          python -c "import duckdb; c=duckdb.connect('DATA.duckdb', read_only=True); print('matches_analysis COUNT =', c.execute('SELECT COUNT(*) FROM matches_analysis').fetchone()[0]); c.close()"

      - name: Python sözdizimini doğrula
        run: python -m py_compile denetim_v5.py tests/test_denetim_v5.py

      - name: ALT/ÜST birim testlerini çalıştır
        run: python -m pytest -q tests/test_denetim_v5.py

      - name: Ham veride tarih ve oran kapsamını teşhis et
        run: |
          python - <<'PY'
          import duckdb
          import pandas as pd
          con = duckdb.connect("DATA.duckdb", read_only=True)
          try:
              df = con.execute('''
                  SELECT match_date, FT, "MS25AÜ", "25A_num", "25Ü_num"
                  FROM matches_analysis
              ''').fetchdf()
          finally:
              con.close()
          dates = pd.to_datetime(df["match_date"], errors="coerce")
          print("Ham satır sayısı:", len(df))
          print("Tarih min:", dates.min())
          print("Tarih max:", dates.max())
          print("Tarihi çözülemeyen:", int(dates.isna().sum()))
          years = dates.dt.year
          for year in range(2013, 2022):
              part = df.loc[years.eq(year)]
              alt = pd.to_numeric(part["25A_num"].astype("string").str.replace(",", ".", regex=False), errors="coerce")
              ust = pd.to_numeric(part["25Ü_num"].astype("string").str.replace(",", ".", regex=False), errors="coerce")
              print(f"YIL {year}: satır={len(part)}, ALT dolu={int(alt.notna().sum())}, ÜST dolu={int(ust.notna().sum())}")
          PY

      - name: Gerçek DATA.duckdb üzerinde iki dönemli denetim
        run: python denetim_v5.py "$GITHUB_WORKSPACE/DATA.duckdb"

      - name: İki dönemli analiz çıktılarını doğrula
        run: |
          python - <<'PY'
          import csv
          import pathlib

          out = pathlib.Path("denetim_ciktilari")
          required = [
              out / "05_iki_donem_tum_bantlar.csv",
              out / "08_kalite_kontrol.csv",
              out / "04a_bantlar_kesif.csv",
              out / "04b_bantlar_dogrulama.csv",
              out / "RAPOR.md",
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit("HATA: beklenen çıktı eksik: " + ", ".join(missing))
          with (out / "08_kalite_kontrol.csv").open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          checks = {row.get("kontrol"): row.get("sonuc") for row in rows}
          for key in ("veritabani_satir", "kesif_bahis", "dogrulama_bahis", "BH_aile_buyuklugu"):
              print(f"{key}: {checks.get(key)}")
          if int(float(checks["kesif_bahis"])) <= 0:
              raise SystemExit("HATA: keşif bahis sayısı sıfır")
          if int(float(checks["dogrulama_bahis"])) <= 0:
              raise SystemExit("HATA: doğrulama bahis sayısı sıfır")
          with (out / "05_iki_donem_tum_bantlar.csv").open("r", encoding="utf-8-sig", newline="") as f:
              bands = list(csv.DictReader(f))
          print("05_iki_donem_tum_bantlar.csv satır:", len(bands))
          if not bands:
              raise SystemExit("HATA: bant CSV boş")
          if any(r.get("donem") not in {"Kesif", "Dogrulama"} for r in bands):
              raise SystemExit("HATA: beklenmeyen dönem etiketi")
          print("CSV üretildi: denetim_ciktilari/05_iki_donem_tum_bantlar.csv")
          print("CSV üretildi: denetim_ciktilari/08_kalite_kontrol.csv")
          print("RAPOR.md üretildi: denetim_ciktilari/RAPOR.md")
          PY

      - name: Denetim çıktılarını artifact olarak yayınla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alt-ust-iki-donem-denetim
          path: denetim_ciktilari/
          if-no-files-found: error
          retention-days: 30
