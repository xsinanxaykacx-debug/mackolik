name: One-time remote branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-remote-branches.yml'

permissions:
  contents: write

jobs:
  delete-legacy-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete requested remote branches and remove this temporary workflow
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              "feature/two-period-audit-validated",
              "feature/1x2-audit",
              "chore/ci-path-filters",
              "feature/alt-ust-final",
              "feature/fix-audit-test-discovery"
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: "heads/" + branch
                });
                core.info("DAL SİLİNDİ: " + branch);
              } catch (error) {
                if (error.status === 404) {
                  core.info("DAL ZATEN YOK: " + branch);
                } else {
                  throw error;
                }
              }
            }
            const path = ".github/workflows/cleanup-remote-branches.yml";
            const file = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: "main"
            });
            await github.rest.repos.deleteContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "chore: remove one-time branch cleanup workflow",
              sha: file.data.sha,
              branch: "main"
            });
            core.info("GEÇİCİ WORKFLOW KALDIRILDI");
